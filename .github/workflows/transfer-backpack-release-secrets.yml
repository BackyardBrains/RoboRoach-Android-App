name: Transfer BYB Backpack Android release secrets

# Run once from main after BYB_BACKPACK_SECRETS_TOKEN is added to the release
# environment. Greg requires the token to remain until he explicitly says OK
# to delete it (Watson capture 111434); it expires after seven days.
on:
  workflow_dispatch:

permissions: {}

jobs:
  transfer:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ secrets.BYB_BACKPACK_SECRETS_TOKEN }}
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
    steps:
      - name: Copy only Backpack Android release credentials
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${GH_TOKEN:-}" ]] || { echo '::error::BYB_BACKPACK_SECRETS_TOKEN is missing from the release environment'; exit 1; }
          destination='BackyardBrains/BYBBackpack'
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD GOOGLE_PLAY_SERVICE_ACCOUNT_JSON; do
            [[ -n "${!name:-}" ]] || { echo "::error::Missing release secret: $name"; exit 1; }
          done
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD GOOGLE_PLAY_SERVICE_ACCOUNT_JSON; do
            printf '%s' "${!name}" | gh secret set "$name" --repo "$destination"
            echo "Transferred $name"
          done
